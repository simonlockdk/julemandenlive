# Nordpolens Kontrolcentral – HTTPS (port 443)
# Node-appen kører i en rootless podman-container på 127.0.0.1:3200.
# Videoer under /media serveres direkte af Apache (hurtigt, med range-requests).
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin webmaster@julemandenlive.dk
    ServerName julemandenlive.dk
    ServerAlias www.julemandenlive.dk
    DocumentRoot /var/www/julemandenlive.dk/public_html/
    ErrorLog ${APACHE_LOG_DIR}/julemandenlive.dk_error.log
    CustomLog ${APACHE_LOG_DIR}/julemandenlive.dk_access.log combined

    # www -> julemandenlive.dk (én adresse)
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.julemandenlive\.dk$ [NC]
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://julemandenlive.dk%{REQUEST_URI} [R=301,L,NE]

    # ---------- videoer og billeder direkte fra disken ----------
    Alias /media/ /var/www/julemandenlive.dk/media/
    <Directory /var/www/julemandenlive.dk/media/>
        Options -Indexes -FollowSymLinks -ExecCGI -Includes
        AllowOverride None
        Require all denied
        # Ingen kode må nogensinde køres fra upload-mappen
        <IfModule mod_php.c>
            php_admin_flag engine off
        </IfModule>
        <IfModule mod_php8.c>
            php_admin_flag engine off
        </IfModule>
        RemoveHandler .php .phtml .phar .cgi .pl .py .sh
        RemoveType .php .phtml .phar
        <FilesMatch "\.(mp4|m4v|webm|m3u8|ts|m4s|vtt|jpe?g|png|webp)$">
            Require all granted
        </FilesMatch>
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=3600"
            Header set X-Content-Type-Options "nosniff"
        </IfModule>
    </Directory>
    AddType application/vnd.apple.mpegurl .m3u8
    AddType video/mp2t .ts

    # ---------- reverse proxy til appen ----------
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass        /.well-known/acme-challenge/ !
    ProxyPass        /media/ !
    ProxyPass        / http://127.0.0.1:3200/ connectiontimeout=5 timeout=600
    ProxyPassReverse / http://127.0.0.1:3200/

    # Apache er eneste kilde til sikkerhedsheadere
    <IfModule mod_headers.c>
        Header onsuccess unset X-Frame-Options
        Header always unset X-Frame-Options
        Header onsuccess unset X-Content-Type-Options
        Header always unset X-Content-Type-Options
        Header onsuccess unset Referrer-Policy
        Header always unset Referrer-Policy
        Header onsuccess unset Permissions-Policy
        Header always unset Permissions-Policy
        Header onsuccess unset Content-Security-Policy
        Header always unset Content-Security-Policy
        Header onsuccess unset Cross-Origin-Opener-Policy
        Header always unset Cross-Origin-Opener-Policy
        Header onsuccess unset Cross-Origin-Resource-Policy
        Header always unset Cross-Origin-Resource-Policy
        Header always set X-Frame-Options "DENY"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
        Header always set Cross-Origin-Opener-Policy "same-origin"
        Header always set Cross-Origin-Resource-Policy "same-origin"
        Header always set X-Permitted-Cross-Domain-Policies "none"
        Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org; font-src 'self' data:; connect-src 'self' https://tiles.openfreemap.org; media-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    </IfModule>

    # Standard-loft for forespørgsler; større for video-upload i administrationen
    LimitRequestBody 10485760
    <Location "/api/admin/media">
        LimitRequestBody 1073741824
    </Location>

    # Administrationen skal aldrig i søgemaskiner eller caches
    <LocationMatch "^/(admin|api/admin)">
        Header onsuccess unset X-Robots-Tag
        Header onsuccess unset Cache-Control
        Header always set X-Robots-Tag "noindex, nofollow"
        Header always set Cache-Control "no-store"
    </LocationMatch>

    # Ingen TRACE-forespørgsler
    TraceEnable Off

    # Valgfrit: begræns administrationen til bestemte IP-adresser
    # <LocationMatch "^/(admin|api/admin)">
    #     Require ip 127.0.0.1 ::1 DIN.IP.ADRESSE.HER
    # </LocationMatch>

    ErrorDocument 502 "Nordpolens Kontrolcentral opdateres – prøv igen om et øjeblik."
    ErrorDocument 503 "Nordpolens Kontrolcentral opdateres – prøv igen om et øjeblik."

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/julemandenlive.dk/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/julemandenlive.dk/privkey.pem
</VirtualHost>
</IfModule>
