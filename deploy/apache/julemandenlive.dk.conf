# Nordpolens Kontrolcentral – HTTP (port 80)
# Bruges kun til Let's Encrypt-fornyelse og omdirigering til HTTPS.
<VirtualHost *:80>
    ServerAdmin webmaster@julemandenlive.dk
    ServerName julemandenlive.dk
    ServerAlias www.julemandenlive.dk
    DocumentRoot /var/www/julemandenlive.dk/public_html/
    ErrorLog ${APACHE_LOG_DIR}/julemandenlive.dk_error.log
    CustomLog ${APACHE_LOG_DIR}/julemandenlive.dk_access.log combined

    <Directory /var/www/julemandenlive.dk/public_html/>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://julemandenlive.dk%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
